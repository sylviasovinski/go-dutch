<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Go Dutch</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <style>
    :root {
      color-scheme: light;
      --bg: #FAFAF8;
      --surface: #FFFFFF;
      --surface-alt: #F2F1ED;
      --border: #E4E2DB;
      --fg: #1A1917;
      --fg-dim: #7A7870;
      --fg-muted: #A8A49A;
      --accent: #2D7A4F;
      --accent-light: #E8F5EE;
      --danger: #C74B3F;
      --danger-light: #FDF0EE;
      --font-body: 'DM Sans', system-ui, -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, monospace;
      --radius: 10px;
      --radius-sm: 6px;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #141413; --surface: #1E1E1C; --surface-alt: #262624;
        --border: #353530; --fg: #EDECE8; --fg-dim: #908C82; --fg-muted: #605D55;
        --accent: #4CAF72; --accent-light: #1A2E22;
        --danger: #E06B60; --danger-light: #2C1A18;
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #141413; --surface: #1E1E1C; --surface-alt: #262624;
      --border: #353530; --fg: #EDECE8; --fg-dim: #908C82; --fg-muted: #605D55;
      --accent: #4CAF72; --accent-light: #1A2E22;
      --danger: #E06B60; --danger-light: #2C1A18;
      color-scheme: dark;
    }

    body {
      margin: 0; padding: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
      font-size: 14px;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
      padding-block: 0;
      min-height: 100%;
    }
    img { max-width: 100%; }
    * { box-sizing: border-box; margin: 0; }
    [hidden]:not([hidden="until-found" i]) { display: none !important; }

    .app {
      max-width: 520px;
      margin: 0 auto;
      padding-block: 24px 100px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Header */
    .header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }
    .header-left { display: flex; flex-direction: column; gap: 4px; }
    .header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .header p { color: var(--fg-dim); font-size: 0.875rem; }

    /* Dark mode toggle */
    .theme-toggle {
      width: 36px; height: 36px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--fg-dim);
      font-size: 1.1rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.2s, border-color 0.2s;
      margin-top: 4px;
    }
    .theme-toggle:hover { background: var(--surface-alt); border-color: var(--fg-muted); }

    /* Sections */
    .section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      font-size: 0.8125rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--fg-dim);
    }
    .section-body { padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }

    /* Person colors */
    .avatar-dot {
      display: inline-block;
      width: 10px; height: 10px;
      border-radius: 50%;
      margin-right: 4px;
      vertical-align: middle;
      flex-shrink: 0;
    }

    /* People chips */
    .people-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: 100px;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: default;
    }
    .chip .remove {
      width: 16px; height: 16px;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: 50%;
      background: var(--danger-light);
      color: var(--danger);
      font-size: 0.75rem;
      cursor: pointer;
      border: none;
      font-family: inherit;
      line-height: 1;
    }
    .chip .remove:hover { background: var(--danger); color: #fff; }

    .add-row { display: flex; gap: 8px; }
    .add-row input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg);
      color: var(--fg);
      font-family: inherit;
      font-size: 0.875rem;
      outline: none;
    }
    .add-row input:focus { border-color: var(--accent); }
    .add-row input::placeholder { color: var(--fg-muted); }

    .btn {
      padding: 8px 14px;
      border: none;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.15s;
    }
    .btn:active { opacity: 0.7; }
    .btn-accent { background: var(--accent); color: #fff; }
    .btn-ghost { background: var(--surface-alt); color: var(--fg); border: 1px solid var(--border); }
    .btn-danger { background: var(--danger-light); color: var(--danger); }

    /* Currency settings */
    .currency-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .currency-row label { font-size: 0.8125rem; color: var(--fg-dim); white-space: nowrap; }
    .currency-row select, .currency-row input[type="number"] {
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg);
      color: var(--fg);
      font-family: inherit;
      font-size: 0.875rem;
      outline: none;
    }
    .currency-row select:focus, .currency-row input[type="number"]:focus { border-color: var(--accent); }
    .currency-row input[type="number"] { width: 110px; }

    /* Toggle */
    .toggle-row { display: flex; align-items: center; gap: 10px; font-size: 0.8125rem; color: var(--fg-dim); }
    .toggle {
      position: relative;
      width: 40px; height: 22px;
      background: var(--border);
      border-radius: 11px;
      cursor: pointer;
      border: none;
      padding: 0;
      flex-shrink: 0;
      transition: background 0.2s;
    }
    .toggle::after {
      content: '';
      position: absolute;
      top: 2px; left: 2px;
      width: 18px; height: 18px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    .toggle[aria-checked="true"] { background: var(--accent); }
    .toggle[aria-checked="true"]::after { transform: translateX(18px); }

    /* Item card */
    .item-card {
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .item-top { display: flex; gap: 8px; align-items: flex-start; flex-wrap: wrap; }
    .item-top input[type="text"] {
      flex: 1; min-width: 100px;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg);
      color: var(--fg);
      font-family: inherit;
      font-size: 0.875rem;
      outline: none;
    }
    .item-top input[type="text"]:focus { border-color: var(--accent); }
    .item-price-group { display: flex; gap: 0; align-items: center; }
    .item-price-group .cur-label {
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm) 0 0 var(--radius-sm);
      background: var(--surface-alt);
      color: var(--fg-dim);
      font-family: var(--font-mono);
      font-size: 0.8125rem;
      font-weight: 500;
      white-space: nowrap;
      line-height: 1.35;
    }
    .item-price-group input[type="number"] {
      width: 110px;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-left: none;
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-mono);
      font-size: 0.875rem;
      outline: none;
    }
    .item-price-group input[type="number"]:focus { border-color: var(--accent); }
    .item-idr-equiv {
      font-size: 0.75rem;
      color: var(--fg-muted);
      font-family: var(--font-mono);
      padding-left: 2px;
    }

    /* Who ate it — with quick presets */
    .who-ate { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .who-ate-label { font-size: 0.75rem; color: var(--fg-muted); margin-right: 2px; }
    .person-toggle {
      padding: 4px 10px;
      border: 1px solid var(--border);
      border-radius: 100px;
      background: var(--bg);
      color: var(--fg-dim);
      font-family: inherit;
      font-size: 0.8125rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    .person-toggle:hover { border-color: var(--accent); }
    .person-toggle.active {
      background: var(--accent-light);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
    }

    /* Quick split presets */
    .split-presets {
      display: flex;
      gap: 6px;
      padding-top: 2px;
    }
    .preset-btn {
      padding: 3px 10px;
      border: 1px dashed var(--border);
      border-radius: 100px;
      background: transparent;
      color: var(--fg-muted);
      font-family: inherit;
      font-size: 0.6875rem;
      font-weight: 500;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      transition: all 0.15s;
    }
    .preset-btn:hover { border-color: var(--accent); color: var(--accent); }

    .item-actions { display: flex; justify-content: flex-end; }

    /* Tax / service trigger */
    .tax-trigger {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .tax-trigger:active { background: var(--surface-alt); }
    .tax-trigger-left { display: flex; flex-direction: column; gap: 2px; }
    .tax-trigger-label { font-size: 0.875rem; font-weight: 500; }
    .tax-trigger-detail { font-size: 0.75rem; color: var(--fg-muted); font-family: var(--font-mono); }
    .tax-trigger-arrow { color: var(--fg-muted); font-size: 1.1rem; }

    /* Modal overlay */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 100;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: auto; }

    .modal-sheet {
      background: var(--surface);
      border-radius: 16px 16px 0 0;
      width: 100%; max-width: 520px;
      max-height: 85vh;
      overflow-y: auto;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
      padding-bottom: env(safe-area-inset-bottom, 16px);
    }
    .modal-overlay.open .modal-sheet { transform: translateY(0); }

    .modal-handle { display: flex; justify-content: center; padding: 12px 0 4px; }
    .modal-handle::before {
      content: '';
      width: 36px; height: 4px;
      border-radius: 2px;
      background: var(--border);
    }

    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 20px 16px;
    }
    .modal-header h2 { font-size: 1.1rem; font-weight: 700; }
    .modal-close {
      width: 30px; height: 30px;
      border-radius: 50%;
      background: var(--surface-alt);
      border: 1px solid var(--border);
      color: var(--fg-dim);
      font-size: 1rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: inherit;
    }
    .modal-close:hover { background: var(--border); }
    .modal-body { padding: 0 20px 20px; display: flex; flex-direction: column; gap: 20px; }

    .tax-field { display: flex; flex-direction: column; gap: 8px; }
    .tax-field-label {
      font-size: 0.8125rem; font-weight: 600;
      color: var(--fg-dim);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .seg-control {
      display: flex;
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      overflow: hidden;
    }
    .seg-btn {
      flex: 1; padding: 8px 12px;
      border: none; background: transparent;
      color: var(--fg-dim);
      font-family: inherit; font-size: 0.8125rem; font-weight: 500;
      cursor: pointer; transition: all 0.15s; text-align: center;
    }
    .seg-btn + .seg-btn { border-left: 1px solid var(--border); }
    .seg-btn.active { background: var(--accent); color: #fff; font-weight: 600; }

    .tax-input-row { display: flex; align-items: center; gap: 8px; }
    .tax-input-row input {
      flex: 1; padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-mono);
      font-size: 1rem;
      outline: none;
    }
    .tax-input-row input:focus { border-color: var(--accent); }
    .tax-input-row .unit { font-size: 0.875rem; color: var(--fg-dim); font-weight: 600; min-width: 28px; }

    .modal-done {
      width: 100%; padding: 14px;
      font-size: 0.9375rem; border-radius: var(--radius);
    }

    /* Receipt-style summary */
    .receipt-section {
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      position: relative;
    }
    .receipt-section::before,
    .receipt-section::after {
      content: '';
      display: block;
      height: 8px;
      background: radial-gradient(circle 5px at 10px 0, transparent 5px, var(--surface) 5px);
      background-size: 20px 8px;
      background-position: -5px 0;
    }
    .receipt-section::before { margin-bottom: -1px; }
    .receipt-section::after { margin-top: -1px; }

    .summary-line {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 5px 16px;
    }
    .summary-line .label { font-size: 0.8125rem; color: var(--fg-dim); }
    .summary-line .amount {
      font-family: var(--font-mono);
      font-size: 0.875rem;
      font-variant-numeric: tabular-nums;
      color: var(--fg-dim);
    }

    .summary-divider {
      border: none;
      border-top: 1px dashed var(--border);
      margin: 6px 16px;
    }

    .summary-total {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 8px 16px 4px;
    }
    .summary-total .label { font-size: 0.9375rem; font-weight: 700; }
    .summary-total .amount {
      font-family: var(--font-mono);
      font-size: 1.25rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .person-breakdown {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 8px 16px 12px;
    }
    .breakdown-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      background: var(--surface-alt);
      border-radius: var(--radius-sm);
    }
    .breakdown-row .name {
      font-weight: 600;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .breakdown-row .amt {
      font-family: var(--font-mono);
      font-size: 0.9rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    /* Settlement with animation */
    .settlement-card {
      background: var(--accent-light);
      border: 1px solid var(--accent);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      font-size: 0.875rem;
      line-height: 1.6;
    }
    .settlement-card .line {
      display: flex; gap: 6px; align-items: baseline;
      opacity: 0;
      transform: translateY(8px);
      animation: settleIn 0.35s ease forwards;
    }
    .settlement-card .line:nth-child(1) { animation-delay: 0s; }
    .settlement-card .line:nth-child(2) { animation-delay: 0.08s; }
    .settlement-card .line:nth-child(3) { animation-delay: 0.16s; }
    .settlement-card .line:nth-child(4) { animation-delay: 0.24s; }
    .settlement-card .line:nth-child(5) { animation-delay: 0.32s; }

    @keyframes settleIn {
      to { opacity: 1; transform: translateY(0); }
    }

    .settlement-card .arrow { color: var(--accent); font-weight: 700; }
    .settlement-card .settle-amount {
      font-family: var(--font-mono);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .copy-main {
      width: 100%;
      padding: 16px;
      font-size: 1rem;
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .copy-main.copied {
      background: #1a8a4a; color: #fff;
      transform: scale(0.97);
    }

    .empty-state {
      text-align: center;
      padding: 24px 16px;
      color: var(--fg-muted);
      font-size: 0.875rem;
    }

    /* Sticky total bar */
    .sticky-bar {
      position: fixed;
      bottom: 0;
      left: 0; right: 0;
      z-index: 50;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 12px 16px;
      padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
      display: flex;
      justify-content: center;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
    }
    .sticky-bar.visible { transform: translateY(0); }
    .sticky-bar-inner {
      max-width: 520px;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .sticky-bar .bar-label {
      font-size: 0.8125rem;
      color: var(--fg-dim);
      font-weight: 500;
    }
    .sticky-bar .bar-amount {
      font-family: var(--font-mono);
      font-size: 1.125rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    @media (max-width: 480px) {
      .item-top { flex-direction: column; }
      .item-price-group { width: 100%; }
      .item-price-group input[type="number"] { flex: 1; }
    }
  </style>
</head>
<body>

<div class="app" id="app">
  <div class="header">
    <div class="header-left">
      <h1>Go Dutch</h1>
      <p>Split bills fairly</p>
    </div>
    <button class="theme-toggle" onclick="toggleTheme()" id="theme-btn" title="Toggle dark mode">
      <span id="theme-icon">&#9790;</span>
    </button>
  </div>

  <div class="section">
    <div class="section-header">People</div>
    <div class="section-body">
      <div class="people-list" id="people-list"></div>
      <div class="add-row">
        <input type="text" id="person-input" placeholder="Name" maxlength="20">
        <button class="btn btn-accent" onclick="addPerson()">Add</button>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-header">Currency</div>
    <div class="section-body">
      <div class="currency-row">
        <label>Bill currency</label>
        <select id="bill-currency" onchange="onCurrencyChange()">
          <option value="IDR" selected>IDR — Rupiah</option>
          <option value="JPY">JPY — Yen</option>
          <option value="USD">USD — Dollar</option>
          <option value="SGD">SGD — Sing Dollar</option>
          <option value="MYR">MYR — Ringgit</option>
          <option value="THB">THB — Baht</option>
          <option value="EUR">EUR — Euro</option>
          <option value="GBP">GBP — Pound</option>
          <option value="KRW">KRW — Won</option>
          <option value="CNY">CNY — Yuan</option>
          <option value="AUD">AUD — Aus Dollar</option>
          <option value="TWD">TWD — NT Dollar</option>
          <option value="HKD">HKD — HK Dollar</option>
          <option value="PHP">PHP — Peso</option>
          <option value="VND">VND — Dong</option>
        </select>
      </div>
      <div class="toggle-row" id="kurs-row" hidden>
        <button class="toggle" id="kurs-toggle" role="switch" aria-checked="false" onclick="toggleKurs()"></button>
        <span>Use kurs jual beli</span>
      </div>
      <div class="currency-row" id="kurs-beli-row" hidden>
        <label>Kurs beli 1 <span id="kurs-beli-label">USD</span> =</label>
        <input type="number" id="kurs-beli-input" placeholder="15800" min="0" step="any" oninput="recalc()">
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-header">
      <span>Items</span>
      <button class="btn btn-accent" onclick="addItem()" style="padding:5px 12px;font-size:0.75rem;">+ Item</button>
    </div>
    <div class="section-body" id="items-list">
      <div class="empty-state" id="items-empty">Tap + Item to add items</div>
    </div>
  </div>

  <div class="section">
    <div class="section-header">Tax & Service</div>
    <div class="tax-trigger" onclick="openTaxModal()">
      <div class="tax-trigger-left">
        <span class="tax-trigger-label" id="tax-trigger-label">Tax 11% · Service 0%</span>
        <span class="tax-trigger-detail" id="tax-trigger-detail">Tap to edit</span>
      </div>
      <span class="tax-trigger-arrow">&#8250;</span>
    </div>
  </div>

  <div class="modal-overlay" id="tax-modal" onclick="closeTaxModalOutside(event)">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <div class="modal-header">
        <h2>Tax & Service</h2>
        <button class="modal-close" onclick="closeTaxModal()">&#10005;</button>
      </div>
      <div class="modal-body">
        <div class="tax-field">
          <span class="tax-field-label">Tax</span>
          <div class="seg-control">
            <button class="seg-btn active" onclick="setTaxMode('pct', this)">%</button>
            <button class="seg-btn" onclick="setTaxMode('fixed', this)">Fixed Amount</button>
          </div>
          <div class="tax-input-row">
            <input type="number" id="tax-input" value="11" min="0" step="any" oninput="recalcFromModal()">
            <span class="unit" id="tax-unit">%</span>
          </div>
        </div>
        <div class="tax-field">
          <span class="tax-field-label">Service</span>
          <div class="seg-control">
            <button class="seg-btn active" onclick="setSvcMode('pct', this)">%</button>
            <button class="seg-btn" onclick="setSvcMode('fixed', this)">Fixed Amount</button>
          </div>
          <div class="tax-input-row">
            <input type="number" id="service-input" value="0" min="0" step="any" oninput="recalcFromModal()">
            <span class="unit" id="svc-unit">%</span>
          </div>
        </div>
        <button class="btn btn-accent modal-done" onclick="closeTaxModal()">Done</button>
      </div>
    </div>
  </div>

  <!-- Receipt-style summary -->
  <div class="receipt-section" id="summary-section" hidden>
    <div class="section-header" style="border-bottom: none; padding-bottom: 4px;">Summary</div>
    <div id="summary-lines"></div>
    <hr class="summary-divider">
    <div class="summary-total">
      <span class="label">Grand Total</span>
      <span class="amount" id="grand-total">Rp 0</span>
    </div>
    <div class="person-breakdown" id="person-breakdown"></div>
  </div>

  <div class="section" id="settle-section" hidden>
    <div class="section-header">Who Pays Who</div>
    <div class="section-body">
      <div class="settlement-card" id="settlement-card"></div>
    </div>
  </div>

  <button class="btn btn-accent copy-main" id="copy-btn" onclick="copyToClipboard()" hidden>
    📋 Copy Split Summary
  </button>
</div>

<!-- Sticky total bar -->
<div class="sticky-bar" id="sticky-bar">
  <div class="sticky-bar-inner">
    <span class="bar-label">Running total</span>
    <span class="bar-amount" id="bar-total">Rp 0</span>
  </div>
</div>

<script>
const PERSON_COLORS = [
  '#4CAF72','#5B8DEF','#E8A838','#E06B60','#9B6DD7',
  '#E47AB5','#45B8C2','#8B6F4E','#6B8E5A','#D4765C'
];

function getPersonColor(name) {
  const idx = state.people.indexOf(name);
  return PERSON_COLORS[idx % PERSON_COLORS.length];
}

const state = {
  people: [],
  items: [],
  nextItemId: 1
};
let lastCalc = {};

// --- Escape helpers ---
function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
function escAttr(s) {
  return s.replace(/&/g,'&amp;').replace(/'/g,'&#39;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// --- Theme ---
function toggleTheme() {
  const root = document.documentElement;
  const current = root.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  root.setAttribute('data-theme', next);
  document.getElementById('theme-icon').innerHTML = next === 'dark' ? '&#9788;' : '&#9790;';
  try { localStorage.setItem('go-dutch-theme', next); } catch(e) {}
}
(function initTheme() {
  try {
    const saved = localStorage.getItem('go-dutch-theme');
    if (saved) {
      document.documentElement.setAttribute('data-theme', saved);
      document.getElementById('theme-icon').innerHTML = saved === 'dark' ? '&#9788;' : '&#9790;';
    }
  } catch(e) {}
})();

// --- Formatting ---
function fmtIDR(n) {
  return 'Rp ' + Math.round(n).toLocaleString('id-ID');
}
function fmtCurrency(n, cur) {
  if (cur === 'IDR') return fmtIDR(n);
  const symbols = { USD:'$', EUR:'&#8364;', GBP:'&#163;', JPY:'&#165;', SGD:'S$', MYR:'RM', THB:'&#3647;', KRW:'&#8361;', CNY:'&#165;', AUD:'A$', TWD:'NT$', HKD:'HK$', PHP:'&#8369;', VND:'&#8363;' };
  const sym = symbols[cur] || cur + ' ';
  const decimals = ['JPY','KRW','VND'].includes(cur) ? 0 : 2;
  return sym + Number(n).toLocaleString('en-US', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
}
function fmtCurrencyPlain(n, cur) {
  if (cur === 'IDR') return fmtIDR(n);
  const symbols = { USD:'$', EUR:'€', GBP:'£', JPY:'¥', SGD:'S$', MYR:'RM', THB:'฿', KRW:'₩', CNY:'¥', AUD:'A$', TWD:'NT$', HKD:'HK$', PHP:'₱', VND:'₫' };
  const sym = symbols[cur] || cur + ' ';
  const decimals = ['JPY','KRW','VND'].includes(cur) ? 0 : 2;
  return sym + Number(n).toLocaleString('en-US', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
}

// --- People ---
function addPerson() {
  const input = document.getElementById('person-input');
  const name = input.value.trim();
  if (!name || state.people.includes(name)) { input.value = ''; return; }
  state.people.push(name);
  input.value = '';
  renderPeople();
  renderAllItems();
  recalc();
}
document.getElementById('person-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') addPerson();
});

function removePerson(name) {
  state.people = state.people.filter(p => p !== name);
  state.items.forEach(item => {
    item.assignees = item.assignees.filter(a => a !== name);
  });
  renderPeople();
  renderAllItems();
  recalc();
}

function renderPeople() {
  const list = document.getElementById('people-list');
  if (state.people.length === 0) { list.innerHTML = ''; return; }
  list.innerHTML = state.people.map(p => {
    const color = getPersonColor(p);
    return `<span class="chip"><span class="avatar-dot" style="background:${color}"></span>${esc(p)}<button class="remove" onclick="removePerson('${escAttr(p)}')" aria-label="Remove ${esc(p)}">&#10005;</button></span>`;
  }).join('');
}

// --- Currency ---
function onCurrencyChange() {
  const cur = document.getElementById('bill-currency').value;
  const isIDR = cur === 'IDR';
  document.getElementById('kurs-row').hidden = isIDR;
  if (isIDR) {
    document.getElementById('kurs-beli-row').hidden = true;
    document.getElementById('kurs-toggle').setAttribute('aria-checked', 'false');
  }
  document.getElementById('kurs-beli-label').textContent = cur;
  // Update placeholder to realistic rate for selected currency
  const placeholders = { JPY:'115', USD:'15800', SGD:'11800', MYR:'3400', THB:'440', EUR:'17200', GBP:'20000', KRW:'11', CNY:'2200', AUD:'10200', TWD:'490', HKD:'2020', PHP:'275', VND:'0.62' };
  document.getElementById('kurs-beli-input').placeholder = placeholders[cur] || '10000';
  state.items.forEach(item => { item.currency = cur; });
  renderAllItems();
  recalc();
}

function toggleKurs() {
  const btn = document.getElementById('kurs-toggle');
  const checked = btn.getAttribute('aria-checked') === 'true';
  btn.setAttribute('aria-checked', String(!checked));
  document.getElementById('kurs-beli-row').hidden = checked;
  recalc();
}

function getRate() {
  const cur = document.getElementById('bill-currency').value;
  if (cur === 'IDR') return 1;
  // Always use kurs beli input as the rate (shown only when toggle ON)
  return parseFloat(document.getElementById('kurs-beli-input').value) || 0;
}

function getKursBeli() {
  return null; // merged into getRate()
}

// --- Items ---
function addItem() {
  const cur = document.getElementById('bill-currency').value;
  state.items.push({
    id: state.nextItemId++,
    name: '',
    price: 0,
    currency: cur,
    assignees: [...state.people]
  });
  document.getElementById('items-empty').hidden = true;
  renderAllItems();
}

function removeItem(id) {
  state.items = state.items.filter(i => i.id !== id);
  if (state.items.length === 0) document.getElementById('items-empty').hidden = false;
  renderAllItems();
  recalc();
}

function toggleAssignee(itemId, person) {
  const item = state.items.find(i => i.id === itemId);
  if (!item) return;
  if (item.assignees.includes(person)) {
    item.assignees = item.assignees.filter(a => a !== person);
  } else {
    item.assignees.push(person);
  }
  renderAllItems();
  recalc();
}

function quickSplit(itemId, mode) {
  const item = state.items.find(i => i.id === itemId);
  if (!item) return;
  if (mode === 'all') {
    item.assignees = [...state.people];
  } else if (mode === 'me') {
    item.assignees = state.people.length > 0 ? [state.people[0]] : [];
  } else if (mode === 'none') {
    item.assignees = [];
  }
  renderAllItems();
  recalc();
}

function onItemNameChange(id, val) {
  const item = state.items.find(i => i.id === id);
  if (item) item.name = val;
}

function onItemPriceChange(id, val) {
  const item = state.items.find(i => i.id === id);
  if (item) { item.price = parseFloat(val) || 0; }
  // Don't re-render items (would reset focus) — just update IDR equiv label if visible
  const cur = document.getElementById('bill-currency').value;
  const rate = getRate();
  if (cur !== 'IDR' && rate > 0) {
    const card = document.querySelector(`[data-item-id="${id}"]`);
    if (card) {
      const equiv = card.querySelector('.item-idr-equiv');
      if (equiv) equiv.textContent = '≈ ' + fmtIDR(item.price * rate);
    }
  }
  recalc();
}

function renderAllItems() {
  const container = document.getElementById('items-list');
  const empty = document.getElementById('items-empty');
  container.querySelectorAll('.item-card').forEach(c => c.remove());
  if (state.items.length === 0) { empty.hidden = false; return; }
  empty.hidden = true;

  const rate = getRate();
  const cur = document.getElementById('bill-currency').value;

  state.items.forEach(item => {
    const div = document.createElement('div');
    div.className = 'item-card';
    div.dataset.itemId = item.id;

    const idrEquiv = cur !== 'IDR' && rate > 0
      ? `<div class="item-idr-equiv">≈ ${fmtIDR(item.price * rate)}</div>` : '';

    div.innerHTML = `
      <div class="item-top">
        <input type="text" placeholder="Item name" value="${escAttr(item.name)}" oninput="onItemNameChange(${item.id}, this.value)">
        <div class="item-price-group">
          <span class="cur-label">${cur}</span>
          <input type="number" placeholder="0" value="${item.price || ''}" min="0" step="any" oninput="onItemPriceChange(${item.id}, this.value)">
        </div>
      </div>
      ${idrEquiv}
      <div class="who-ate">
        <span class="who-ate-label">Split:</span>
        ${state.people.map(p => {
          const color = getPersonColor(p);
          const active = item.assignees.includes(p);
          return `<button class="person-toggle ${active ? 'active' : ''}" style="${active ? `border-color:${color};color:${color};background:${color}18` : ''}" onclick="toggleAssignee(${item.id}, '${escAttr(p)}')">${esc(p)}</button>`;
        }).join('')}
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div class="split-presets">
          <button class="preset-btn" onclick="quickSplit(${item.id},'all')">All</button>
          <button class="preset-btn" onclick="quickSplit(${item.id},'me')">Just me</button>
          <button class="preset-btn" onclick="quickSplit(${item.id},'none')">None</button>
        </div>
        <button class="btn btn-danger" style="padding:4px 10px; font-size:0.75rem;" onclick="removeItem(${item.id})">Remove</button>
      </div>
    `;
    container.appendChild(div);
  });
}

// --- Tax & Service Modal ---
let taxMode = 'pct';
let svcMode = 'pct';

function openTaxModal() {
  document.getElementById('tax-modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeTaxModal() {
  document.getElementById('tax-modal').classList.remove('open');
  document.body.style.overflow = '';
  updateTaxTrigger();
}
function closeTaxModalOutside(e) {
  if (e.target === e.currentTarget) closeTaxModal();
}

function setTaxMode(mode, btn) {
  taxMode = mode;
  const row = btn.closest('.tax-field').querySelector('.seg-control');
  row.querySelectorAll('.seg-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const cur = document.getElementById('bill-currency').value;
  document.getElementById('tax-unit').textContent = mode === 'pct' ? '%' : cur;
  document.getElementById('tax-input').value = '';
  recalc();
}
function setSvcMode(mode, btn) {
  svcMode = mode;
  const row = btn.closest('.tax-field').querySelector('.seg-control');
  row.querySelectorAll('.seg-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const cur = document.getElementById('bill-currency').value;
  document.getElementById('svc-unit').textContent = mode === 'pct' ? '%' : cur;
  document.getElementById('service-input').value = '';
  recalc();
}

function recalcFromModal() { recalc(); updateTaxTrigger(); }

function updateTaxTrigger() {
  const taxVal = parseFloat(document.getElementById('tax-input').value) || 0;
  const svcVal = parseFloat(document.getElementById('service-input').value) || 0;
  const cur = document.getElementById('bill-currency').value;
  let taxStr = taxMode === 'pct' ? `Tax ${taxVal}%` : `Tax ${fmtCurrencyPlain(taxVal, cur)}`;
  let svcStr = svcMode === 'pct' ? `Service ${svcVal}%` : `Service ${fmtCurrencyPlain(svcVal, cur)}`;
  document.getElementById('tax-trigger-label').textContent = `${taxStr} · ${svcStr}`;
  const hasValue = taxVal > 0 || svcVal > 0;
  document.getElementById('tax-trigger-detail').textContent = hasValue ? 'Tap to edit' : 'Tap to add tax or service';
}

// --- Calculation ---
function recalc() {
  const bar = document.getElementById('sticky-bar');
  if (state.people.length === 0 || state.items.length === 0) {
    document.getElementById('summary-section').hidden = true;
    document.getElementById('settle-section').hidden = true;
    document.getElementById('copy-btn').hidden = true;
    bar.classList.remove('visible');
    return;
  }

  const rate = getRate();
  const cur = document.getElementById('bill-currency').value;
  const taxVal = parseFloat(document.getElementById('tax-input').value) || 0;
  const svcVal = parseFloat(document.getElementById('service-input').value) || 0;

  const shares = {};
  state.people.forEach(p => shares[p] = 0);

  let subtotal = 0;
  state.items.forEach(item => {
    subtotal += item.price;
    if (item.assignees.length === 0) return;
    const perPerson = item.price / item.assignees.length;
    item.assignees.forEach(p => {
      if (shares[p] !== undefined) shares[p] += perPerson;
    });
  });

  const taxAmount = taxMode === 'pct' ? subtotal * (taxVal / 100) : taxVal;
  const svcAmount = svcMode === 'pct' ? subtotal * (svcVal / 100) : svcVal;
  const grandTotalOriginal = subtotal + taxAmount + svcAmount;
  const multiplier = subtotal > 0 ? grandTotalOriginal / subtotal : 1;

  const effectiveRate = (cur === 'IDR') ? 1 : rate;
  const grandTotalIDR = grandTotalOriginal * effectiveRate;

  lastCalc = { subtotal, taxAmount, svcAmount, grandTotalOriginal, grandTotalIDR, effectiveRate, cur, taxVal, svcVal, personTotalsIDR: {} };

  document.getElementById('summary-section').hidden = false;
  document.getElementById('copy-btn').hidden = false;

  const summaryLines = document.getElementById('summary-lines');
  let linesHtml = '';
  const fmtLine = (val, label) => {
    let display = fmtIDR(val * effectiveRate);
    if (cur !== 'IDR') display = fmtCurrency(val, cur) + ' ≈ ' + display;
    return `<div class="summary-line"><span class="label">${label}</span><span class="amount">${display}</span></div>`;
  };
  linesHtml += fmtLine(subtotal, 'Subtotal');
  if (taxAmount > 0) {
    linesHtml += fmtLine(taxAmount, taxMode === 'pct' ? `Tax (${taxVal}%)` : 'Tax');
  }
  if (svcAmount > 0) {
    linesHtml += fmtLine(svcAmount, svcMode === 'pct' ? `Service (${svcVal}%)` : 'Service');
  }
  summaryLines.innerHTML = linesHtml;

  let totalDisplay = fmtIDR(grandTotalIDR);
  if (cur !== 'IDR') totalDisplay = fmtCurrency(grandTotalOriginal, cur) + ' ≈ ' + fmtIDR(grandTotalIDR);
  document.getElementById('grand-total').innerHTML = totalDisplay;

  bar.classList.add('visible');
  document.getElementById('bar-total').innerHTML = totalDisplay;

  const breakdown = document.getElementById('person-breakdown');
  const personTotalsIDR = {};
  breakdown.innerHTML = state.people.map(p => {
    const shareOriginal = shares[p] * multiplier;
    const shareIDR = shareOriginal * effectiveRate;
    personTotalsIDR[p] = shareIDR;
    lastCalc.personTotalsIDR[p] = shareIDR;
    let display = fmtIDR(shareIDR);
    if (cur !== 'IDR') display = fmtCurrency(shareOriginal, cur) + ' ≈ ' + fmtIDR(shareIDR);
    const color = getPersonColor(p);
    return `<div class="breakdown-row"><span class="name"><span class="avatar-dot" style="background:${color}"></span>${esc(p)}</span><span class="amt">${display}</span></div>`;
  }).join('');

  // Settlement
  const avg = grandTotalIDR / state.people.length;
  const balances = state.people.map(p => ({ name: p, balance: personTotalsIDR[p] - avg }));
  const debtors = balances.filter(b => b.balance > 1).sort((a, b) => b.balance - a.balance);
  const creditors = balances.filter(b => b.balance < -1).sort((a, b) => a.balance - b.balance);

  const settlements = [];
  let di = 0, ci = 0;
  const dCopy = debtors.map(d => ({ ...d }));
  const cCopy = creditors.map(c => ({ ...c, balance: Math.abs(c.balance) }));

  while (di < dCopy.length && ci < cCopy.length) {
    const amount = Math.min(dCopy[di].balance, cCopy[ci].balance);
    if (amount > 1) {
      settlements.push({ from: dCopy[di].name, to: cCopy[ci].name, amount: Math.round(amount) });
    }
    dCopy[di].balance -= amount;
    cCopy[ci].balance -= amount;
    if (dCopy[di].balance < 1) di++;
    if (cCopy[ci].balance < 1) ci++;
  }

  const settleSection = document.getElementById('settle-section');
  if (settlements.length === 0) { settleSection.hidden = true; return; }
  settleSection.hidden = false;

  const card = document.getElementById('settlement-card');
  card.innerHTML = settlements.map(s => {
    const fromColor = getPersonColor(s.from);
    const toColor = getPersonColor(s.to);
    return `<div class="line"><span class="arrow">→</span> <strong style="color:${fromColor}">${esc(s.from)}</strong> pays <strong style="color:${toColor}">${esc(s.to)}</strong> <span class="settle-amount">${fmtIDR(s.amount)}</span></div>`;
  }).join('');
}

// --- Copy ---
function copyToClipboard() {
  const c = lastCalc;
  const cur = c.cur || 'IDR';
  const fmtAmt = (n) => fmtCurrencyPlain(n, 'IDR');

  let text = '🧾 *Go Dutch — ' + fmtAmt(c.grandTotalIDR) + '*\n\n';

  state.items.forEach(item => {
    if (item.name && item.price) {
      const priceIDR = item.price * c.effectiveRate;
      text += item.name + ' · ' + fmtAmt(priceIDR);
      if (item.assignees.length > 0 && item.assignees.length < state.people.length) {
        text += ' · ' + item.assignees.join(', ');
      }
      text += '\n';
    }
  });

  if (c.taxAmount > 0 || c.svcAmount > 0) {
    const parts = [];
    if (c.taxAmount > 0) parts.push(taxMode === 'pct' ? `Tax ${c.taxVal}%` : `Tax ${fmtAmt(c.taxAmount * c.effectiveRate)}`);
    if (c.svcAmount > 0) parts.push(svcMode === 'pct' ? `Svc ${c.svcVal}%` : `Svc ${fmtAmt(c.svcAmount * c.effectiveRate)}`);
    text += '+ ' + parts.join(', ') + '\n';
  }

  text += '\n*Each owes:*\n';
  state.people.forEach(p => {
    text += '▸ ' + p + ' · ' + fmtAmt(c.personTotalsIDR[p] || 0) + '\n';
  });

  const card = document.getElementById('settlement-card');
  const lines = card.querySelectorAll('.line');
  if (lines.length > 0) {
    text += '\n💸 *Settle:*\n';
    lines.forEach(line => {
      const from = line.querySelectorAll('strong')[0]?.textContent;
      const to = line.querySelectorAll('strong')[1]?.textContent;
      const amt = line.querySelector('.settle-amount')?.textContent;
      text += from + ' → ' + to + ' *' + amt + '*\n';
    });
  }

  const btn = document.getElementById('copy-btn');
  try {
    navigator.clipboard.writeText(text).then(() => {
      btn.innerHTML = '✅ Copied! Paste in WhatsApp';
      btn.classList.add('copied');
      setTimeout(() => { btn.innerHTML = '📋 Copy Split Summary'; btn.classList.remove('copied'); }, 2000);
    }).catch(() => fallbackCopy(text));
  } catch (e) { fallbackCopy(text); }
}

function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;left:-999px';
  document.body.appendChild(ta);
  ta.select();
  const btn = document.getElementById('copy-btn');
  btn.textContent = 'Text selected — paste manually';
  btn.classList.add('copied');
  setTimeout(() => { btn.textContent = '📋 Copy Split Summary'; btn.classList.remove('copied'); ta.remove(); }, 3000);
}

// --- Init ---
state.people = ['Me', 'Friend'];
renderPeople();
</script>

</body>
